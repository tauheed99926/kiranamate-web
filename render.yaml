services:
  - type: web
    name: kiranamate
    env: node
    plan: free
    buildCommand: "npm run install:all && npm run db:setup && npm run build"
    startCommand: "npm run dev:server"
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:./data/kiranamate.db"
